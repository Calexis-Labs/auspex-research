[project]
name = "netagent"
version = "0.1.0"
description = "Kapali agda calisan, salt-okunur network ariza teshis asistani — Faz 0"
requires-python = ">=3.11"
dependencies = [
    "scrapli==2026.2.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
